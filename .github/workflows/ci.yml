name: CI

on:
  push:
  pull_request:

jobs:
  # Students' forks: show their progress.
  progress:
    if: github.repository != 'eanquis/jsreps'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run verify

  # Main repository: check the CLI, the exercises and the solutions.
  checks:
    if: github.repository == 'eanquis/jsreps'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: npm run test:templates
      - run: npm run test:solutions
